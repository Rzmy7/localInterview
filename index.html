<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Voice Recorder</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app-container">
    <h1>🎙️ Interview Recorder</h1>

    <!-- NEW INTERVIEW FORM -->
    <section class="card">
      <h2>New Session</h2>
      <label for="candidate">Candidate Name *</label>
      <input type="text" id="candidate" placeholder="e.g. Jane Doe" required />

      <label for="interviewer">Interviewer Name</label>
      <input type="text" id="interviewer" placeholder="e.g. John Smith" />

      <label for="notes">Notes / Observations</label>
      <textarea id="notes" placeholder="Key takeaways during interview..."></textarea>

      <div class="timer" id="timerDisplay">00:00</div>
      <div class="status" id="wakeLockStatus">Screen Lock: Inactive</div>

      <div class="controls">
        <button id="recordBtn" class="btn btn-record">Start Recording</button>
        <button id="stopBtn" class="btn btn-stop" disabled>Stop & Save</button>
      </div>
    </section>

    <!-- DATA BACKUP & TRANSFER -->
    <section class="card">
      <h2>Data Backup & Transfer</h2>
      <div class="controls">
        <button id="exportBtn" class="btn btn-export">Export All Data</button>
        
        <label class="btn btn-import">
          Import Data
          <input type="file" id="importInput" accept=".json" style="display: none;" />
        </label>
      </div>
    </section>

    <!-- SAVED INTERVIEWS LIST -->
    <section class="card">
      <h2>Past Interviews</h2>
      <div id="interviewsList">Loading saved interviews...</div>
    </section>
  </main>

</body>
</html>
